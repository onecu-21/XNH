[workspace]
members = [
    "crates/xnh-cli",
    "crates/xnh-core",
    "crates/xnh-geometry",
    "crates/xnh-graph",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
